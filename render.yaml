services:
  - type: web
    name: ai-workout-counter
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npx drizzle-kit push
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-workout-counter-db
          property: connectionString

databases:
  - name: ai-workout-counter-db
    databaseName: ai_workout_counter
    user: ai_workout_counter
    region: singapore
    plan: free
    ipAllowList: []
